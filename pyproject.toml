[project]
name = "justai"
version = "5.8.1"
description = "Makes working with LLMs like OpenAI GPT, Anthropic Claude, Google Gemini and Open source models super easy"
readme = "README.md"
authors = [{ name = "HP Harmsen", email = "hp@harmsen.nl" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["OpenAI", "ChatGPT", "GPT-5", "GPT5", "api", "Claude", "Anthropic", "Lllama", "Gemini", "Grok", "Perplexity", "Sonar", "Kimi", "Moonshot"]
requires-python = ">=3.10"
dependencies = [
    "absl-py",
    "anthropic>=0.90",
    "google-genai",
    "httpx",
    "instructor",
    "jsonschema",
    "justdays",
    "lxml",
    "openai",
    "pillow",
    "pydantic",
    "python-dateutil",
    "python-dotenv",
    "rich",
    "tiktoken",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["black", "pytest", "build", "twine", "nox"]
llama = ["llama-cpp-python"]

[project.urls]
Homepage = "https://github.com/hpharmsen/justai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

# Legt de projectstijl uit CLAUDE.md vast, zodat ruff format hem niet terugdraait.
# Gemeten op deze repo: zonder sectie 4837 diffregels, met alleen line-length 3794,
# met enkele quotes erbij 1922.
[tool.ruff]
line-length = 120
# Ruff 0.16 formatteert ook Python-codeblokken in markdown. De voorbeelden in
# README.md en docs/ zijn documentatie en horen niet mee te veranderen.
extend-exclude = ['*.md']

[tool.ruff.format]
quote-style = "single"
